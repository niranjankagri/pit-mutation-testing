# Runs both test suites against the same code and puts line coverage next to the mutation score in the job summary.
#   strong: the build fails if PIT finds a mutant the tests do not kill (threshold 100%)
#   weak:   report only; it is there to show what 100% line coverage can still miss
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 23 * * 5'   # Friday 23:20 UTC: catches a new JDK or runner image breaking the build
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing (${{ matrix.suite }} suite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: strong
            threshold: 100
          - suite: weak
            threshold: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests, JaCoCo and PIT
        run: ./mvnw -B verify -Dsuite=${{ matrix.suite }} -Dmutation.threshold=${{ matrix.threshold }}

      - name: Coverage and mutation summary
        # Also after a failure: the survivors table says which mutant broke the threshold
        if: always() && hashFiles('target/pit-reports/mutations.xml') != ''
        run: python3 scripts/pit_summary.py ${{ matrix.suite }} >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.suite }}
          path: |
            target/pit-reports/
            target/site/jacoco/
          if-no-files-found: ignore
